:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2939;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#18212e;color:white;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center}header h1{font-size:23px;margin:0}header small{color:#b7c5d7}main{max-width:1100px;margin:auto;padding:22px 16px 70px}nav{display:flex;gap:8px;overflow:auto;margin:18px 0}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;font-weight:650;background:#e7ebf0;color:#243247}button.primary{background:#2563eb;color:white}button.danger{color:#b42318;background:#feeceb}nav button.active{background:#18212e;color:white}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.bar h2{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:white;border:1px solid #e2e7ed;border-radius:16px;padding:20px;margin:12px 0;box-shadow:0 2px 8px #15223808}.metric{font-size:27px;font-weight:750;margin-top:9px}.muted{color:#66758a;font-size:13px}.green{color:#12804b}.red{color:#c03232}h3{margin:0 0 14px}input,select{width:100%;padding:11px;border:1px solid #cfd7e1;border-radius:9px;font:inherit;background:white}label{display:block;font-size:13px;color:#526175;margin:10px 0 5px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}.form button{height:43px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #edf0f3;padding:12px 0}.row:first-of-type{border-top:0}.row small{color:#66758a}.actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;background:#e9f2ff;color:#2459aa;border-radius:30px;padding:4px 8px;font-size:12px}.progress{height:9px;background:#e7ebf0;border-radius:20px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;background:#2563eb}.notice{padding:12px;border-radius:10px;background:#edf5ff;color:#234b7d;font-size:13px}.footer{background:#eaf7ef;border:1px solid #c9e8d2}.quick-expense{width:100%;text-align:left;background:#f7faff;border:1px solid #dbe7f9;padding:12px;margin:5px 0;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.quick-expense:hover,.quick-expense:focus-visible{background:#eaf3ff;outline:2px solid #2563eb;outline-offset:1px}.quick-expense .muted{font-weight:400}.quick-expense .quick-add{color:#175cd3;font-weight:750;white-space:nowrap}.modal-backdrop{position:fixed;inset:0;background:#101828aa;display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}.modal-panel{background:white;border-radius:18px;padding:24px;width:min(100%,440px);box-shadow:0 18px 55px #0003}.modal-panel h3{margin-bottom:6px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.hidden{display:none!important}@media(max-width:700px){.grid,.form{grid-template-columns:1fr}.metric{font-size:23px}header{padding:16px}.row{align-items:flex-start}.bar{flex-wrap:wrap}nav button{white-space:nowrap}}

/* Joe's Orçamento — palette inspirée du drapeau portugais */
:root{color:#20382c;background:#f5f8f3}
body,body:is(*){background:#f5f8f3}
header{background:linear-gradient(110deg,#006b3f 0%,#006b3f 69%,#c81d25 69%,#c81d25 100%);border-bottom:4px solid #f5c542}
header small{color:#e4f2e8}
button{background:#e7f0e9;color:#164d32}
button.primary{background:#006b3f;color:#fff}
button.primary:hover{background:#00522f}
nav button.active{background:#006b3f;color:white}
.card{border-color:#dce9de;box-shadow:0 2px 8px #063c1c0b}
.green{color:#006b3f}.red{color:#c81d25}
input,select{border-color:#b8d1be}
input:focus,select:focus{outline:2px solid #006b3f;outline-offset:1px}
.pill{background:#e5f3e8;color:#006b3f}
.progress{background:#e2eee4}.progress span{background:#00834d}
.notice{background:#eef6e9;color:#28572f}
.footer{background:#eaf5e7;border-color:#bcdcc1}
.quick-expense{background:#f5fbf6;border-color:#cde4d1}
.quick-expense:hover,.quick-expense:focus-visible{background:#e9f6ec;outline-color:#006b3f}
.quick-expense .quick-add{color:#006b3f}
button.danger,.close-row button{color:#b51c24;background:#fff0ef}
@media(max-width:700px){
 body{background:#f5f8f3}
 nav#tabs{border-top-color:#cfe2d2}
 nav#tabs button.active{background:#e2f2e7;color:#006b3f}
 .mobile-more{background:#006b3f;color:#fff;border:1px solid #f5c542}
}
.joe-brand{display:flex;align-items:center;gap:12px}.joe-brand img{width:54px;height:54px;border-radius:14px;object-fit:cover;border:2px solid #f5c542;box-shadow:0 2px 10px #0003}@media(max-width:700px){.joe-brand img{width:46px;height:46px}}

const KEY='mon-budget-v1';let storageAvailable=true;try{localStorage.setItem('__budget_test','1');localStorage.removeItem('__budget_test')}catch(e){storageAvailable=false}const now=new Date();let current=new Date(now.getFullYear(),now.getMonth(),1),tab='dashboard',quickCategory=null;const fresh=()=>({salary:0,rent:0,rents:[],envelopes:{Courses:0,Loisirs:0,'Économies':0},fixed:[],months:{}});let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{db=fresh()}db={...fresh(),...db};db.savingsAccounts=Array.isArray(db.savingsAccounts)?db.savingsAccounts:[];db.savingsMovements=Array.isArray(db.savingsMovements)?db.savingsMovements:[];const money=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n)||0),key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),previous=k=>{let [y,m]=k.split('-').map(Number);return key(new Date(y,m-2,1))},monthLabel=k=>new Date(k+'-01T12:00:00').toLocaleDateString('pt-PT',{month:'long',year:'numeric'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Math.max(0,Number(v)||0),sum=xs=>xs.reduce((a,b)=>a+b,0),save=()=>{if(storageAvailable){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){storageAvailable=false;alert('Stockage indisponible : exporte une sauvegarde depuis Histórico pour ne pas perdre tes données.')}}};
function scopeChoice(){let r=prompt('Aplicar alteração:\n1 — Apenas este mês\n2 — Este mês e os seguintes','1');if(r===null)return null;if(r.trim()==='1')return 'month';if(r.trim()==='2')return 'future';alert('Escolhe 1 ou 2.');return null}
function recurrentChoice(){return confirm('Repetir todos os meses?\nOK = Sim; Cancelar = Apenas este mês.')}
function recurringItems(m,type){return (m[type]||[]).filter(x=>x.recurring!==false)}
function applyItem(type,id,scope,change){let k=key(current);for(let [mk,m] of Object.entries(db.months)){if(mk<k||scope==='month'&&mk!==k)continue;let x=(m[type]||[]).find(a=>a.id===id);if(!x)continue;if(change===null){if(scope==='month'){m.futureRestores=m.futureRestores||{};m.futureRestores[type]=m.futureRestores[type]||[];m.futureRestores[type].push({...x})}m[type]=m[type].filter(a=>a.id!==id)}else {if(scope==='month'){x.futureValue={name:x.name,amount:x.amount,active:x.active,recurring:x.recurring}}Object.assign(x,change)}}save();render()}
function prepareItems(){let ks=Object.keys(db.months).sort();for(let k of ks){let m=db.months[k];normalizeRents(m);for(let type of ['rents','fixed'])for(let x of m[type]){if(!x.id){let match=ks.filter(z=>z<k).reverse().map(z=>(db.months[z][type]||[]).find(y=>y.name===x.name&&y.amount===x.amount&&y.id)).find(Boolean);x.id=match?.id||uid()}if(x.recurring===undefined)x.recurring=true}}}
function normalizeRents(m){if(!Array.isArray(m.rents)){m.rents=Number(m.rent)>0?[{name:'Rente / Loyer',amount:num(m.rent)}]:[]}return m.rents}function rentTotal(m){return sum(normalizeRents(m).map(x=>num(x.amount)))}function ensure(k){if(db.months[k]){normalizeRents(db.months[k]);return db.months[k]};let old=Object.keys(db.months).filter(x=>x<k).sort().pop(),base=old?db.months[old]:null;let m={salary:base?(base.salaryRecurring===false?0:(base.salaryFuture??base.salary)):db.salary,salaryRecurring:base?base.salaryRecurring!==false:true,rent:0,rents:recurringItems(base||db,'rents').map(x=>({...x,...(x.futureValue||{}),futureValue:undefined})).concat((base?.futureRestores?.rents||[]).filter(x=>x.recurring!==false).map(x=>({...x}))),envelopes:{...(base?base.envelopes:db.envelopes)},fixed:recurringItems(base||db,'fixed').map(x=>({...x,...(x.futureValue||{}),futureValue:undefined})).concat((base?.futureRestores?.fixed||[]).filter(x=>x.recurring!==false).map(x=>({...x}))),expenses:[],saved:null,extra:0};db.months[k]=m;save();return m}prepareItems();function get(){return ensure(key(current))}function fixedTotal(m){return sum(m.fixed.filter(x=>x.active).map(x=>x.amount))}function spent(m,c){return sum(m.expenses.filter(x=>x.category===c).map(x=>x.amount))}function pool(m){return m.salary+rentTotal(m)-fixedTotal(m)}function cumulative(k){return sum(Object.entries(db.months).filter(([a])=>a<=k).map(([,m])=>m.saved===null?0:m.saved))}function remaining(m){return pool(m)-sum(Object.values(m.envelopes))}function unused(m){return sum(Object.entries(m.envelopes).filter(([c])=>c!=='Économies').map(([c,a])=>Math.max(0,a-spent(m,c))))}function accountBalance(id,k){return sum(db.savingsMovements.filter(x=>x.accountId===id&&x.month<=k).map(x=>Number(x.amount)||0))}function totalAccountBalance(k){return sum(db.savingsAccounts.map(a=>accountBalance(a.id,k)))}function allocatedMonth(k){return sum(db.savingsMovements.filter(x=>x.month===k&&x.kind==='allocation').map(x=>Number(x.amount)||0))}
